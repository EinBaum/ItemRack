name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: zip -r "ItemRack-${GITHUB_REF_NAME#v}.zip" ItemRack ItemRackOptions
      - uses: softprops/action-gh-release@v2
        with:
          files: ItemRack-*.zip
          generate_release_notes: true
